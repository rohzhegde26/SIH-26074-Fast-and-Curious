[project]
name = "sih-weather-sprint4"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "httpx>=0.27,<1.0",
]
pipeline = [
  "torch",
  "numpy",
  "scipy",
  "xarray",
  "zarr",
  "matplotlib",
  "geopandas",
  "pyproj",
  "shapely",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
