# data/preprocessing_config.yaml
# Canonical Preprocessing Specification & Dataset Contract
# Sprint 2: Dataset Builder & Data QA Engine

version: "1.0.0"
dataset_name: "multitask_temporal_v1"
temporal_convention: "calendar_day_00_24_utc"

# Antecedent weather history and future forecast lead window lengths
history_window_days: 3
forecast_lead_days: 7

# Chronological partition specification
splits:
  train_years: [2015, 2016, 2017, 2018, 2019, 2020, 2021]
  val_years: [2022]
  test_years: [2023]
  quarantined_pretrain_history_only_years: [2014]
  season:
    start_month: 6
    start_day: 1
    end_month: 9
    end_day: 30
    days_per_season: 122
  total_forecast_samples: 1098
  expected_split_counts:
    train: 854
    val: 122
    test: 122

# Channel ordering across all weather streams
channels:
  weather_channels: ["precipitation", "tmax", "tmin", "rh", "wind_u", "wind_v"]
  terrain_channels: ["elevation", "slope", "sin_aspect", "cos_aspect", "windward_lift"]

# Explicit spatial resolution and provenance attribution
target_resolution:
  precipitation: "native_0.05deg (UCSB CHIRPS v2.0 p05)"
  thermodynamics: "regridded_from_0.1deg_to_0.05deg (ECMWF ERA5-Land bilinear)"
  wind: "regridded_from_0.25deg_to_0.05deg (ECMWF ERA5 atmospheric bilinear)"

# Primary on-disk gridded data source paths
raw_sources:
  chirps_file: "data/raw/chirps/chirps_daily.nc"
  era5_land_thermo_file: "data/raw/era5_land/era5_land_daily.nc"
  era5_wind_file: "data/raw/era5/era5_wind_daily.nc"
  terrain_file: "data/raw/dem/glo30_mandya_terrain.nc"
  gfs_cache_dir: "data/raw/forecast/gfs"

# Provenance identifiers
provenance_contract:
  gfs_source: "NOAA_GFS"
  era5_wind_source: "ECMWF_ERA5_OPENMETEO_NATIVE_UV"
  gfs_archive_tiers:
    ncar_tier_years: [2015, 2016, 2017, 2018, 2019, 2020]
    ncar_tier_name: "ncar_rda_ds084_1"
    aws_tier_years: [2021, 2022, 2023]
    aws_tier_name: "aws_open_data"

# Open-Meteo ingestion parameters
openmeteo_ingestion:
  coordinate_batch_size: 128
  temporal_chunk_months: 4
  retry_attempts: 5
  retry_backoff_seconds: 3.0

# Zero-fallback operational policy
zero_fallback_policy:
  allow_openmeteo_construction_fallback: false
  openmeteo_allowed_role: "audit_and_point_sanity_check_only"
  missing_data_action: "flag_and_exclude_sample"
  forbidden_sources_in_forecast: ["ERA5", "CHIRPS", "ERA5_LAND"]

# Daily aggregation rules for GFS forecast product
daily_forecast_rules:
  tmax_rule: "max(TMP at 3-hourly lead hours f003..f024)"
  tmin_rule: "min(TMP at 3-hourly lead hours f003..f024)"
  rh_rule: "mean(RH at 3-hourly lead hours f003..f024)"
  wind_u_rule: "mean(UGRD at 3-hourly lead hours f003..f024)"
  wind_v_rule: "mean(VGRD at 3-hourly lead hours f003..f024)"
  precip_rule: "sum(APCP across 6-hour buckets)"

# Exact GFS lead-to-target-day mapping
# Initialized at 00Z on Day D. Target days are D, D+1, ..., D+6.
lead_mapping:
  0:
    day_offset: 0
    forecast_interval_hours: [0, 24]
    apcp_6h_buckets: ["0-6 hour acc fcst", "6-12 hour acc fcst", "12-18 hour acc fcst", "18-24 hour acc fcst"]
    thermo_wind_lead_hours: [3, 6, 9, 12, 15, 18, 21, 24]
  1:
    day_offset: 1
    forecast_interval_hours: [24, 48]
    apcp_6h_buckets: ["24-30 hour acc fcst", "30-36 hour acc fcst", "36-42 hour acc fcst", "42-48 hour acc fcst"]
    thermo_wind_lead_hours: [27, 30, 33, 36, 39, 42, 45, 48]
  2:
    day_offset: 2
    forecast_interval_hours: [48, 72]
    apcp_6h_buckets: ["48-54 hour acc fcst", "54-60 hour acc fcst", "60-66 hour acc fcst", "66-72 hour acc fcst"]
    thermo_wind_lead_hours: [51, 54, 57, 60, 63, 66, 69, 72]
  3:
    day_offset: 3
    forecast_interval_hours: [72, 96]
    apcp_6h_buckets: ["72-78 hour acc fcst", "78-84 hour acc fcst", "84-90 hour acc fcst", "90-96 hour acc fcst"]
    thermo_wind_lead_hours: [75, 78, 81, 84, 87, 90, 93, 96]
  4:
    day_offset: 4
    forecast_interval_hours: [96, 120]
    apcp_6h_buckets: ["96-102 hour acc fcst", "102-108 hour acc fcst", "108-114 hour acc fcst", "114-120 hour acc fcst"]
    thermo_wind_lead_hours: [99, 102, 105, 108, 111, 114, 117, 120]
  5:
    day_offset: 5
    forecast_interval_hours: [120, 144]
    apcp_6h_buckets: ["120-126 hour acc fcst", "126-132 hour acc fcst", "132-138 hour acc fcst", "138-144 hour acc fcst"]
    thermo_wind_lead_hours: [123, 126, 129, 132, 135, 138, 141, 144]
  6:
    day_offset: 6
    forecast_interval_hours: [144, 168]
    apcp_6h_buckets: ["144-150 hour acc fcst", "150-156 hour acc fcst", "156-162 hour acc fcst", "162-168 hour acc fcst"]
    thermo_wind_lead_hours: [147, 150, 153, 156, 159, 162, 165, 168]

# Zarr chunk storage specification
zarr_layout:
  history_chunk: [1, 3, 6, 16, 16]
  future_forecast_chunk: [1, 7, 6, 16, 16]
  target_chunk: [1, 7, 6, 80, 80]
  terrain_chunk: [5, 80, 80]
  compression: "zstd"
  clevel: 5

# Normalization parameterization
normalization:
  method: "train_fit_log1p_zscore"
  precip_transform: "log1p"
  compute_split: "train"
  epsilon: 1.0e-6
  clip_precip_min: 0.0
  clip_rh_range: [0.0, 100.0]

# Quality assurance classification criteria
qa_thresholds:
  hard_fail:
    precipitation_min: 0.0
    relative_humidity_range: [0.0, 100.0]
    wind_component_abs_max_ms: 100.0
    require_tmax_gte_tmin: true
    require_zero_future_leakage: true
    require_disjoint_splits: true
    max_unmasked_nan_fraction: 0.0
    max_invalid_fraction: 0.0
    allow_ocean_mask: true
    require_exact_sample_count: 1098
    require_gfs_provenance: true
    require_authentic_wind_source: true
    require_fine_grid_coordinate_match: true
    require_zarr_parquet_split_sync: true
  diagnostics:
    min_valid_pixel_fraction: 0.85
    extreme_precip_threshold_mm: 100.0
    circular_wind_std_min_deg: 15.0

# Raw source tracking for dataset manifest reproducibility
raw_source_tracking:
  record_file_checksums: true
  record_snapshot_dates: true
  hash_algorithm: "sha256"
